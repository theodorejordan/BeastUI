# The quality gates of decision 0009, lean version for the thin slice (Phase 5, step 6):
# build, types, unit tests, contrast, package checks, then axe and keyboard on the built docs.
# Visual regression (screenshots in Docker), size budgets and lint come once there are more
# components. Actions are pinned by commit SHA; the comment names the release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      # Node's version comes from "volta" in package.json, the one used locally.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Chromium for the tests
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Unit and contrast tests
        run: pnpm test

      - name: Check the packages as npm will ship them
        run: pnpm check:packages

      - name: Build the docs
        run: pnpm --filter docs build

      - name: Accessibility and keyboard tests on the docs
        run: pnpm test:e2e

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures
          path: |
            apps/docs/test-results
            packages/*/.vitest
          if-no-files-found: ignore
