# The BeastUI workspace (decision 0001). Packages are published to npm under @beastui;
# apps are not. The Phase 3 preview/ stays outside the workspace, with its own npm lockfile.
packages:
  - packages/*
  - apps/*

# Supply chain: never install a version published less than 48 hours ago (shadcn does the same).
# A compromised release is usually caught and pulled within that window.
minimumReleaseAge: 2880

# Releases (decision 0007): trusted publishing from GitHub Actions turns provenance on by
# default, and npm refuses provenance from a private repo. Remove this line when the repo goes public.
provenance: false
